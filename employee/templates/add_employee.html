{% extends 'base.html' %}

{% block title %}Add Employee | EMS{% endblock %}

{% block content %}

<div class="topbar">

    <div>
        <h1>Add Employee</h1>
        <p>Create a new employee record</p>
    </div>

    <a href="{% url 'employee_list' %}"
       class="btn btn-secondary">
        ← Back
    </a>

</div>


<div class="form-card">

    <h2 style="margin-bottom:25px;">
        Employee Information
    </h2>


    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}


        <div class="form-actions">

            <button type="submit"
                    class="btn btn-primary">
                ✓ Save Employee
            </button>

            <a href="{% url 'employee_list' %}"
               class="btn btn-secondary">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
