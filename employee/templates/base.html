<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}EMS{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef2f7;
            color: #172033;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: linear-gradient(180deg, #111827, #1e293b);
            padding: 25px 18px;
            color: white;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
            padding: 0 12px 35px;
        }

        .logo span {
            color: #60a5fa;
        }

        .menu-title {
            color: #94a3b8;
            font-size: 11px;
            text-transform: uppercase;
            margin: 20px 12px 10px;
        }

        .sidebar a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            padding: 13px 14px;
            margin-bottom: 6px;
            border-radius: 10px;
            transition: 0.2s;
        }

        .sidebar a:hover {
            background: #2563eb;
            color: white;
            transform: translateX(3px);
        }

        /* MAIN */

        .main {
            margin-left: 250px;
            min-height: 100vh;
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .topbar h1 {
            font-size: 28px;
        }

        .topbar p {
            color: #64748b;
            margin-top: 5px;
        }

        .profile {
            background: white;
            padding: 10px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            font-weight: bold;
        }

        /* CARDS */

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 23px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(15,23,42,0.07);
            position: relative;
            overflow: hidden;
        }

        .stat-card h4 {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .stat-card h2 {
            font-size: 30px;
        }

        .stat-icon {
            position: absolute;
            right: 20px;
            top: 22px;
            font-size: 28px;
        }

        .blue {
            border-left: 5px solid #2563eb;
        }

        .green {
            border-left: 5px solid #16a34a;
        }

        .orange {
            border-left: 5px solid #f59e0b;
        }

        .red {
            border-left: 5px solid #dc2626;
        }

        /* CONTENT */

        .content-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(15,23,42,0.07);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header h2 {
            font-size: 20px;
        }

        /* BUTTONS */

        .btn {
            border: none;
            padding: 11px 17px;
            border-radius: 9px;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }

        .btn-secondary {
            background: #64748b;
            color: white;
        }

        /* TABLE */

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f1f5f9;
            color: #475569;
            padding: 15px;
            text-align: left;
            font-size: 13px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        tr:hover {
            background: #f8fafc;
        }

        /* FORM */

        .form-card {
            background: white;
            max-width: 850px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(15,23,42,0.07);
        }

        .form-card p {
            margin-bottom: 18px;
        }

        .form-card label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        .form-card input,
        .form-card select,
        .form-card textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
        }

        .form-card input:focus,
        .form-card select:focus,
        .form-card textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        .form-actions {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        /* BADGES */

        .badge {
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .present {
            background: #dcfce7;
            color: #15803d;
        }

        .absent {
            background: #fee2e2;
            color: #b91c1c;
        }

        /* DELETE */

        .delete-box {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(15,23,42,0.1);
        }

        .delete-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .delete-box h2 {
            margin-bottom: 10px;
        }

        .delete-box p {
            color: #64748b;
            margin-bottom: 25px;
        }

        /* MOBILE */

        @media(max-width: 1000px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media(max-width: 700px) {

            .sidebar {
                width: 70px;
                padding: 20px 8px;
            }

            .logo {
                font-size: 0;
            }

            .logo span {
                font-size: 20px;
            }

            .sidebar a {
                font-size: 0;
                text-align: center;
            }

            .main {
                margin-left: 70px;
                padding: 20px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">

        <div class="logo">
            EMS<span>●</span>
        </div>

        <div class="menu-title">
            Main Menu
        </div>

        <a href="{% url 'dashboard' %}">
            🏠 &nbsp; Dashboard
        </a>

        <a href="{% url 'employee_list' %}">
            👥 &nbsp; Employees
        </a>

        <a href="{% url 'add_employee' %}">
            ➕ &nbsp; Add Employee
        </a>

        <div class="menu-title">
            Attendance
        </div>

        <a href="{% url 'attendance' %}">
            📅 &nbsp; Mark Attendance
        </a>

        <a href="{% url 'attendance_history' %}">
            📊 &nbsp; Attendance History
        </a>

    </aside>


    <main class="main">

        {% block content %}
        {% endblock %}

    </main>

</body>
</html>
